[project]
name = "pyocat"
version = "0.3.0"
description = ""
authors = [
    { name = "WATERCryst Developers", email = "appservice@watercryst.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)", 
    "pydantic (>=2.13.2,<3.0.0)"
]

[tool.poetry.scripts]
main = "python_biocat_rest_api_client:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-httpx (>=0.36.2,<0.37.0)"
]
