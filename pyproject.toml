[project]
name = "pyocat"
version = "0.7.0"
description = "Python client library to connect to BIOCAT devices."
authors = [{ name = "WATERCryst Developers", email = "appservice@watercryst.com" }]
maintainers = [{ name = "WATERCryst Developers", email = "appservice@watercryst.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1", 
    "pydantic>=2.13.2"
]

[project.urls]
Homepage = "https://github.com/WATERCryst/pyocat"
Repository = "https://github.com/WATERCryst/pyocat"
Documentation = "https://github.com/WATERCryst/pyocat"
"Bug Tracker" = "https://github.com/WATERCryst/pyocat/issues"
Changelog = "https://github.com/WATERCryst/pyocat/releases"

[tool.poetry.scripts]
main = "python_biocat_rest_api_client:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-httpx (>=0.36.2,<0.37.0)"
]
